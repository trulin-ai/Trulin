services:
  # =========================================================================
  # 1. DATABASE: PostgreSQL 16 with pgvector Extension
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: context-trust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-context_trust}
      POSTGRES_USER: ${POSTGRES_USER:-context_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-context_user} -d ${POSTGRES_DB:-context_trust}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - context-trust-net

  # =========================================================================
  # 2. BACKEND: Context Trust Layer 11-Layer Core Engine (FastAPI)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: context-trust-backend
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-context_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-context_password}
      - POSTGRES_DB=${POSTGRES_DB:-context_trust}
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-context_user}:${POSTGRES_PASSWORD:-context_password}@postgres:5432/${POSTGRES_DB:-context_trust}
      - SECRET_KEY=${SECRET_KEY:-dev_super_secret_signing_key_at_least_32_bytes}
      - JWT_SECRET=${JWT_SECRET:-dev_super_secret_jwt_key_at_least_32_bytes}
      - CONTEXT_LAYER_CACHE_DIR=/app/.pipeline_cache
      - PORT=8000
    volumes:
      - ./backend:/app
      - pipeline_cache:/app/.pipeline_cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - context-trust-net

  # =========================================================================
  # 3. FRONTEND: React / Vite Interactive Governance Studio
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: context-trust-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - context-trust-net

volumes:
  postgres_data:
    name: context-trust-postgres-data
  pipeline_cache:
    name: context-trust-pipeline-cache

networks:
  context-trust-net:
    name: context-trust-net
    driver: bridge
